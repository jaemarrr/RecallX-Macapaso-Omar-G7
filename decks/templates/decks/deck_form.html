{% extends 'base.html' %}{% block title %}{{ heading }}{% endblock %}
{% block content %}
<div class="card"><h2>{{ heading }}</h2>
<form method="post" novalidate>{% csrf_token %}{{ form.non_field_errors }}
{% for f in form %}<div class="field"><label>{{ f.label }}</label>{{ f }}{{ f.errors }}</div>{% endfor %}
<button class="btn" type="submit">Save</button> <a class="btn secondary" href="{% url 'student_dashboard' %}">Cancel</a></form></div>
{% endblock %}
