{% load static %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}RecallX{% endblock %}</title><link rel="stylesheet" href="{% static 'css/style.css' %}"></head>
<body>
<nav>
  <a class="brand" href="{% url 'home' %}">RecallX</a>
  {% if user.is_authenticated %}
    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="{% url 'profile' %}">Profile</a>
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Logout ({{ user.username }})</button></form>
  {% else %}
    <a href="{% url 'login' %}">Login</a><a href="{% url 'register' %}">Register</a>
  {% endif %}
</nav>
<main>
{% for message in messages %}<div class="msg {{ message.tags }}">{{ message }}</div>{% endfor %}
{% block content %}{% endblock %}
</main></body></html>
