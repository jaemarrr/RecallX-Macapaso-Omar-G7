{% extends 'base.html' %}{% block title %}Register{% endblock %}
{% block content %}
<div class="card"><h2>Create your account</h2>
<form method="post" novalidate>{% csrf_token %}
{{ form.non_field_errors }}
{% for f in form %}<div class="field"><label>{{ f.label }}</label>{{ f }}{{ f.errors }}{% if f.help_text %}<small class="muted">{{ f.help_text|safe }}</small>{% endif %}</div>{% endfor %}
<button class="btn" type="submit">Register</button> <a href="{% url 'login' %}">Already have an account?</a>
</form></div>
{% endblock %}
