{% extends 'base.html' %}{% block title %}Confirm delete{% endblock %}
{% block content %}
<div class="card"><h2>Confirm deletion</h2><p>Are you sure you want to delete {{ object_name }}? This cannot be undone.</p>
<form method="post">{% csrf_token %}<button class="btn danger" type="submit">Yes, delete</button>
<a class="btn secondary" href="{% url cancel_url cancel_pk %}">Cancel</a></form></div>
{% endblock %}
